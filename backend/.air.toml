root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/main"
cmd = "go build -o ./tmp/main ./cmd/api"
delay = 1000
exclude_dir = ["tmp", "vendor", "docs"]
exclude_regex = ["_test.go"]
include_ext = ["go", "tpl", "tmpl", "html"]
stop_on_error = true

[color]
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[screen]
keep_scroll = true
